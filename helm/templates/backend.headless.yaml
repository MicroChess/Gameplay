apiVersion: v1
kind: Service
metadata:
  name: microchess-gameplay-hl
  namespace: microchess-gameplay
spec:
  selector:
    app: microchess-gameplay
  ports:
    - port: 4369
      targetPort: 4369
      name: epmd
    - port: 80
      targetPort: 80
      name: http
    - port: 9000
      targetPort: 9000
      name: dist
  clusterIP: None
  type: ClusterIP