apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: microchess-gameplay-ig
  namespace: microchess-gameplay
spec:
  entryPoints:
    - websecure
  tls:
    secretName: microchess-gameplay-tls
  routes:
    - match: Host(`api.microchess.fdero.com`)
      kind: Rule
      middlewares:
        - name: backend-http-https-redirect
      services:
        - name: microchess-gameplay-sv
          port: 80
          sticky:
            cookie:
              name: microchess-gameplay-sticky
              secure: true
              httpOnly: true
              sameSite: lax