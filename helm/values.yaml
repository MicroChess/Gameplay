config:
  namespace: "microchess"
  authenticatorUrl: "http://microchess-auth.microchess.svc.cluster.local/v1/auth/authorize/native"
  mongodbUrl: "mongodb://mongodb-0.mongodb-headless.microchess.svc.cluster.local:27017"
  hostname: "api.microchess.fdero.com"
  routePrefix: "/v1/gameplay"
  prefix: microchess-gameplay

ports:
  - containerPort: 80
    name: http
  - containerPort: 4369
    name: epmd

image:
  registry: docker.io
  repo: fdero/microchess-gameplay
  tag: latest

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

replicas:
  min: 2
  max: 3