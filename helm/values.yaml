config:
  hostname: "api.microchess.fdero.com"
  routePrefix: "/v1/gameplay"
  prefix: microchess-gameplay

image:
  registry: docker.io
  repo: fdero/microchess-gameplay
  tag: latest

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

replicas:
  min: 2
  max: 3